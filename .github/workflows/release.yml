name: Выпуск сервера

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Проверить версию тега
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$version" = "$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/server-checks.yml
    with:
      release_version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Получить проверенный пакет из черновика
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "family-music-server_${RELEASE_VERSION}_amd64.deb" --pattern SHA256SUMS --dir dist
      - name: Проверить контрольную сумму и версию
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test "$(dpkg-deb -f "family-music-server_${RELEASE_VERSION}_amd64.deb" Version)" = "$RELEASE_VERSION"
      - name: Опубликовать проверенный DEB
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest \
            --title "Family Music Server $RELEASE_TAG"
